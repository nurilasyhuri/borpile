name: Daily SEO Articles Publisher

on:
  schedule:
    # Runs everyday at 23:30 UTC (06:30 WIB pagi)
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate 7 daily SEO articles
        run: node scripts/generate-daily-articles.mjs --count 7

      - name: Validate Astro build & sitemap
        run: npm run build

      - name: Commit and push new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/artikel/
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "content(seo): publish 7 daily SEO articles"
            git push
          fi
